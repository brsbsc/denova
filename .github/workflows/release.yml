name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: Require CI for the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-full-ci.sh

  package:
    name: Package ${{ matrix.target }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64, windows-x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: ci-distribution
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: mkdir -p output && tar -xf ci-distribution.tar -C output
      - name: Package the tested frontend for this platform
        env:
          DENOVA_RELEASE_FRONTEND_DIR: ${{ github.workspace }}/output/web
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/build-github-release.sh "$RELEASE_TAG" "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/github-release/denova-webui-${{ env.RELEASE_TAG }}-*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux-x64'
        with:
          name: release-metadata
          path: dist/github-release/RELEASE_NOTES.md

  desktop:
    name: Package Desktop (${{ matrix.os }})
    needs: ci
    if: vars.DENOVA_DESKTOP_UPDATE_PUBLIC_KEY != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      DENOVA_DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DENOVA_DESKTOP_UPDATE_PUBLIC_KEY }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      DENOVA_DESKTOP_RELEASE: 'true'
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v8
        with:
          name: ci-distribution
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: mkdir -p output && tar -xf ci-distribution.tar -C output
      - name: Prepare optional platform signing and build the tested application
        env:
          DENOVA_RELEASE_FRONTEND_DIR: ${{ github.workspace }}/output/web
          DENOVA_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          node desktop/scripts/signing.mjs
          pnpm --dir desktop build:backend
      - name: Package the application with signed updates
        run: pnpm --dir desktop package
      - name: Exercise the production application
        run: node desktop/test/package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.os }}
          path: output/release-desktop/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified release assets
    needs: [ci, package, desktop]
    if: always() && needs.ci.result == 'success' && needs.package.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/github-release
      - name: Verify the complete platform set and publish
        if: needs.desktop.result == 'success'
        working-directory: dist/github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ needs.ci.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-release.sh" "$RELEASE_TAG" "$RELEASE_SOURCE_SHA"
      - name: Verify and publish WebUI release assets (fork without desktop signing)
        if: needs.desktop.result == 'skipped'
        working-directory: dist/github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          downloads=()
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64 windows-x64; do
            extension=tar.gz
            if [[ "$target" == windows-x64 ]]; then extension=zip; fi
            file="denova-webui-$RELEASE_TAG-$target.$extension"
            test -s "$file"
            downloads+=("$file")
          done
          sha256sum "${downloads[@]}" > checksums.txt
          downloads+=(checksums.txt)
          # Fork releases link to their own verified packages.
          sed -i "s|https://github.com/alfredxw/denova/releases/download/$RELEASE_TAG/denova-webui-|https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/denova-webui-|g" RELEASE_NOTES.md
          sed -i "s|https://raw.githubusercontent.com/alfredxw/denova/$RELEASE_TAG/scripts/install.sh|https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_TAG/scripts/install.sh|g" RELEASE_NOTES.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Published assets are immutable: replacing them races clients that
            # already pinned this release's checksums.
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Refusing to replace published assets; publish a new version instead." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" "${downloads[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" --draft "${downloads[@]}" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          # Latest only points to this version once every archive and checksum
          # has finished uploading. Interrupted uploads leave a private draft.
          gh release edit "$RELEASE_TAG" --draft=false

  container:
    name: Publish verified source Docker images
    needs: [ci, package, publish]
    if: github.repository == 'BRSBSC/denova'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist/github-release
      - name: Prepare verified source bundles for Docker
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            target=linux-x64
            if [[ "$arch" == arm64 ]]; then target=linux-arm64; fi
            mkdir -p "dist/upstream/$arch"
            tar -xzf "dist/github-release/denova-webui-$RELEASE_TAG-$target.tar.gz" -C "dist/upstream/$arch"
            test -x "dist/upstream/$arch/denova/denova"
            test -x "dist/upstream/$arch/denova/denova-updater"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test both source architectures
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" \
              --file docker/Dockerfile --tag "denova-source-smoke:$arch" \
              --build-arg "VERSION=$RELEASE_TAG" \
              --build-arg "SOURCE_REPOSITORY=$GITHUB_REPOSITORY" .
            bash docker/smoke-test.sh "denova-source-smoke:$arch" "linux/$arch" "$RELEASE_TAG"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested source version and latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brsbsc/denova:${{ env.RELEASE_TAG }}
            ghcr.io/brsbsc/denova:latest
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            SOURCE_REPOSITORY=${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ needs.ci.outputs.sha }}
      - name: Report source publication
        run: |
          echo 'Published ghcr.io/brsbsc/denova:${{ env.RELEASE_TAG }} and latest from verified source.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: ${{ needs.ci.outputs.sha }}; platforms: linux/amd64, linux/arm64.' >> "$GITHUB_STEP_SUMMARY"
